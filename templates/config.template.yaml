# Job Pipeline config TEMPLATE — copy to config.yaml and fill in.
# Safe to share (no personal data; personal data lives in profile.yaml).

schedule:
  # Local times the discovery run fires each day.
  times: ["08:00", "12:00", "16:00", "20:00"]
  timezone: "America/Los_Angeles"   # IANA timezone, e.g. "America/New_York"

discovery:
  browse_target: 50      # max API-prefiltered candidates the agent judges per run
  shortlist_size: 20     # roles surfaced to the user per run (fill stage filters further)
  min_candidates: 20     # auto-scaling window expands until this many pre-filter roles
  window_steps_days: [1, 3, 7, 14, 30]  # start 24h, expand stepwise while too few

# One entry per resume. The agent matches each role to the best-fit lane
# and uploads that lane's resume automatically.
lanes:
  - name: agent_infra
    resume: "Your_Name_-_Agent_Infra.pdf"   # filename under your resumes folder
    priority: 1                              # 1 = searched and shortlisted first
    queries:
      - "new grad software engineer agent infrastructure"
      - "new grad AI agent platform engineer"
  - name: ai_cloud
    resume: "Your_Name_-_AI_Cloud.pdf"
    priority: 2
    queries:
      - "new grad backend engineer cloud infrastructure"
      - "new grad software engineer distributed systems"
  - name: genai
    resume: "Your_Name_-_GenAI.pdf"
    priority: 3
    queries:
      - "new grad software engineer LLM"

locations:
  preferred: ["remote", "california"]
  hybrid_ok: true
  # relocation=true: other US locations are eligible but deprioritized in the shortlist.
  # relocation=false: only preferred locations are kept.

grad_rules:
  # When a form only offers future graduation slots, pick the closest one
  # to the real graduation date in profile.yaml. Format: YYYY-MM.
  strategy: "closest_slot_to_2026-03"

# How submit approvals work. Two modes:
#   batch          — fill ALL selected roles, one combined review, "submit all" once. (default)
#   per_application — fill → review → approve → submit → log, one role at a time.
#                     Smaller turns; lets the user stop early.
submit_review_mode: batch

storage:
  tracker: "google_sheet"          # spreadsheet id stored in state/tracker.json after creation
  cache: "state/seen_roles.json"

# Max age of a job posting to consider, in days.
# NOTE: the auto-scaling window (discovery.window_steps_days) is now the
# primary recency control — it starts at 24h and expands stepwise while fewer
# than discovery.min_candidates roles are found. This setting is kept only as
# a legacy fallback. The --max-age-days CLI flag overrides to a fixed window
# for one-time backfills.
#   0.5 = past 12 hours, 1 = past 24 hours, 3 = past 3 days, 7 = past week.
# Applied best-effort: sources with built-in date filters (e.g. LinkedIn's
# past-week) use them; other boards are checked by reading the posting date.
# Boards that expose no date can't be filtered — those roles pass through.
max_post_age_days: 7

# If true, skip the user-selection step: all shortlisted roles go straight
# to Prepare without asking the user to pick. For users who want zero-touch
# discovery. Default false.
# SUBMIT APPROVAL IS NEVER SKIPPED — the user still reviews and approves
# (batch or per-application) before anything is submitted.
auto_select: false

# Explicit never-apply list. Keep this SMALL — it is for companies the user
# personally blacklists, not for already-applied ones.
# Already-applied / already-seen roles live in state/seen_roles.json instead,
# which scales to 10k+ entries without bloating this file.
blacklist:
  companies: []

# Curated job-list sources: community-maintained lists (GitHub repos / pages)
# that publish fresh postings as tables (HTML <table> or markdown). They catch
# companies with no public ATS API. Added during onboarding (ONBOARDING.md
# Step 5): the agent searches for repos matching the user's target roles, the
# user confirms, URLs are saved here.
# Each entry: name, raw table URL, sections to include (substring match on the
# section heading; empty = all sections).
curated_sources:
  - name: simplifyjobs-new-grad
    url: https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/README.md
    sections: ["Software Engineering", "Data Science"]
